# Battery ROI Scoreboard
#
# Drop this file in <config>/packages/ and enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Savings definition used here (arbitrage profit):
#   profit = sum over time of (discharge_kW - charge_kW) * price_now  [EUR/kWh]
#   i.e. value of energy discharged at that moment's tariff
#        minus cost of energy charged at that moment's tariff.
# Integrating power x price continuously is the same as "hourly kWh x hourly
# tariff", but also works for 15-minute tariffs and needs no hourly buckets.
# Round-trip losses are included automatically (you charge more kWh than you
# discharge). Battery wear is NOT included.

# ---------------------------------------------------------------------------
# 1. CONFIG: the only block you need to edit.
#    Replace every entity id marked PLACEHOLDER with your own.
#    Everything below this block reads the battery_roi_* aliases only.
# ---------------------------------------------------------------------------
template:
  - sensor:
      - name: "Battery ROI charge power"
        unique_id: battery_roi_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # PLACEHOLDER: EcoFlow power flowing INTO the battery, in W.
        # If your EcoFlow exposes one signed sensor instead (e.g. + = charging),
        # use: {{ [states('sensor.ecoflow_battery_power') | float(0), 0] | max }}
        state: "{{ states('sensor.ecoflow_battery_charge_power') | float(0) | abs }}"
        availability: "{{ has_value('sensor.ecoflow_battery_charge_power') }}"

      - name: "Battery ROI discharge power"
        unique_id: battery_roi_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # PLACEHOLDER: EcoFlow power flowing OUT of the battery, in W.
        # Signed-sensor variant: {{ [0 - states('sensor.ecoflow_battery_power') | float(0), 0] | max }}
        state: "{{ states('sensor.ecoflow_battery_discharge_power') | float(0) | abs }}"
        availability: "{{ has_value('sensor.ecoflow_battery_discharge_power') }}"

      - name: "Battery ROI price"
        unique_id: battery_roi_price
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        # PLACEHOLDER: your dynamic tariff, all-in import price in EUR/kWh
        # (Tibber, Frank Energie, Zonneplan, Nordpool, ENTSO-e ...).
        # If your sensor reports ct/kWh, append: / 100
        state: "{{ states('sensor.electricity_price_current') | float(0) }}"
        availability: "{{ has_value('sensor.electricity_price_current') }}"

      # Optional extras shown on the card. Not used in the profit maths.
      - name: "Battery ROI state of charge"
        unique_id: battery_roi_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        # PLACEHOLDER: EcoFlow state of charge.
        state: "{{ states('sensor.ecoflow_battery_level') | float(0) }}"
        availability: "{{ has_value('sensor.ecoflow_battery_level') }}"

      - name: "Battery ROI grid power"
        unique_id: battery_roi_grid_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # PLACEHOLDER: HomeWizard P1 active power (+ import, - export).
        state: "{{ states('sensor.p1_meter_active_power') | float(0) }}"
        availability: "{{ has_value('sensor.p1_meter_active_power') }}"

      # -----------------------------------------------------------------------
      # 2. Live financial delta in EUR per hour.
      #    Positive = the battery is earning right now, negative = it is buying.
      # -----------------------------------------------------------------------
      - name: "Battery ROI rate"
        unique_id: battery_roi_rate
        unit_of_measurement: "EUR/h"
        state_class: measurement
        icon: mdi:cash-sync
        state: >
          {% set price = states('sensor.battery_roi_price') | float(0) %}
          {% set kw_out = states('sensor.battery_roi_discharge_power') | float(0) / 1000 %}
          {% set kw_in = states('sensor.battery_roi_charge_power') | float(0) / 1000 %}
          {{ ((kw_out - kw_in) * price) | round(4) }}
        availability: >
          {{ has_value('sensor.battery_roi_price')
             and has_value('sensor.battery_roi_charge_power')
             and has_value('sensor.battery_roi_discharge_power') }}

# ---------------------------------------------------------------------------
# 3. Running profit total in EUR (EUR/h integrated over time).
#    "left" matches a tariff that is a step function; max_sub_interval keeps
#    it accumulating while power and price are steady.
# ---------------------------------------------------------------------------
sensor:
  - platform: integration
    source: sensor.battery_roi_rate
    name: "Battery ROI profit total"
    unique_id: battery_roi_profit_total
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 1

# ---------------------------------------------------------------------------
# 4. Daily and monthly profit. net_consumption lets a day go negative.
#    The previous period's value is kept in the last_period attribute.
# ---------------------------------------------------------------------------
utility_meter:
  battery_roi_profit_daily:
    source: sensor.battery_roi_profit_total
    name: "Battery ROI profit today"
    unique_id: battery_roi_profit_daily
    cycle: daily
    net_consumption: true
  battery_roi_profit_monthly:
    source: sensor.battery_roi_profit_total
    name: "Battery ROI profit this month"
    unique_id: battery_roi_profit_monthly
    cycle: monthly
    net_consumption: true
